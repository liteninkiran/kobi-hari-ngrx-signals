@let question = store.currentQuestion();
<h1>
  What do you get when you Add
  @for (colour of question.caption; track $index) {
    @if ($index > 0) {
      @if ($last) {
        and
      } @else {
        ,
      }
    }

    {{ colour | colourName }}
    <span class="colour-item" [style.background]="colour"></span>
  }
  ?
</h1>
<div class="answers">
  @for (answer of question.answers; track $index) {
    <div class="answer" (click)="store.addAnswer($index)">
      <div class="thumbnail" [style.background]="answer"></div>
      <div class="caption">{{ answer | colourName }}</div>
    </div>
  }
</div>
